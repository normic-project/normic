services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: normic
      POSTGRES_USER: normic
      POSTGRES_PASSWORD: normic
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - normic-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U normic -d normic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  normic-postgres:
